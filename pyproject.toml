[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "med_nube"
version = "0.1.0"
description = "Alturas y techos de construcciones de Medellín a partir de nubes de puntos de dron"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "shapely>=2.0",
  "geopandas>=0.14",
  "pyogrio>=0.7",
  "pyproj>=3.6",
  "laspy[lazrs]>=2.5",
  "rasterio>=1.3",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
